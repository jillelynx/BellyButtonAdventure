<!doctype html><html><head><meta charset="utf-8"><title>Liev 3D poses</title>
<style>body{margin:0;background:#cfe3ee;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }</script></head>
<body><script type="module">
import * as THREE from 'three';
import { preloadLievModel, buildLiev3D } from '../src/characters/liev3d.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfe3ee');
scene.add(new THREE.HemisphereLight('#ffffff', '#8a7a6a', 1.3)); const d = new THREE.DirectionalLight('#fff3e0', 2.4); d.position.set(1.5, 3, 2.5); d.castShadow = true; d.shadow.bias = -0.0004; d.shadow.normalBias = 0.03; scene.add(d);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#b9c9a8' })); floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
await preloadLievModel();
const choice = { player: 'liev', outfit: q.get('outfit') || 'play', hair: q.get('hair') || 'everyday', hat: q.get('hat') === '1' };
const L = buildLiev3D(choice); scene.add(L.root); L.root.rotation.y = +(q.get('yaw') || 0);
const pose = q.get('pose') || 'idle';
const args = { idle: { speed: 0, onGround: true }, walk: { speed: 3.4, onGround: true }, run: { speed: 6.2, onGround: true }, jump: { speed: 2, onGround: false }, cheer: { speed: 0, onGround: true, cheer: true }, swim: { speed: 2, swimming: true, onGround: false }, climb: { speed: 0, climbing: true } }[pose];
const steps = +(q.get('t') || 30); for (let i = 0; i < steps; i++) L.animate(1 / 60, args);
if (q.get('gear')) L.setGear(q.get('gear'));
if (q.get('view') === 'face') { cam.position.set(0, 1.33, 0.8); cam.lookAt(0, 1.31, 0); } else { cam.position.set(0, 0.85, 4.2); cam.lookAt(0, 0.75, 0); }
r.render(scene, cam); window.done = true;
</script></body></html>
